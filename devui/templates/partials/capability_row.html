{{define "capability_row"}}<div class="capability-row"><span class="capability-icon state-{{.State}}" aria-label="{{.State}}">{{if eq .State "ok"}}✓{{else if eq .State "partial"}}△{{else if eq .State "error"}}✕{{else}}○{{end}}</span><div class="capability-copy"><strong>{{.Title}}</strong><p>{{.Explanation}}</p></div>{{if .ActionURL}}<a class="secondary-button" href="{{.ActionURL}}">{{.ActionLabel}}</a>{{end}}</div>{{end}}
