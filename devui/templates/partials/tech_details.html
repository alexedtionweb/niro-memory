{{define "tech_details"}}<details class="tech"><summary>Technical details</summary><table class="tech-table"><tbody>{{range .Fields}}<tr><th scope="row">{{.Key}}</th><td>{{.Value}}</td></tr>{{end}}</tbody></table>{{if .RawJSON}}<div class="tech-raw"><div class="tech-raw-heading"><span>Raw JSON</span><button class="copy-button" type="button" data-copy-target="{{.RawID}}">Copy</button></div><pre id="{{.RawID}}">{{.RawJSON}}</pre></div>{{end}}</details>{{end}}
