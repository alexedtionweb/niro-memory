{{define "progress_bar"}}<div class="progress-component"><div class="progress-heading"><span>{{.Label}}</span><span>{{.Value}} / {{.Total}}</span></div><progress class="progress-{{if and (gt .Total 0) (ge .Value .Total)}}ok{{else}}warn{{end}}" value="{{.Value}}" max="{{if gt .Total 0}}{{.Total}}{{else}}1{{end}}" aria-label="{{.Label}}: {{.Value}} of {{.Total}}"></progress></div>{{end}}
